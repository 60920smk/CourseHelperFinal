<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>영파여고 과목선택 도우미 v2.4</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #f3f4f6; color: #111827; line-height: 1.5; padding: 16px;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 12px 16px; background: #ffffff; border: 1px solid #d1d5db; border-radius: 8px; }
  .header h1 { font-size: 18px; color: #1e3a8a; }
  .header .subtitle { font-size: 12px; color: #6b7280; }
  .btn-pdf {
    background: #1e3a8a; color: white; border: none; padding: 8px 14px;
    border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .btn-pdf:hover { background: #1e40af; }

  .section { background: #ffffff; border: 1px solid #d1d5db; border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
  .section-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #e5e7eb; }
  .section-title .num { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; background: #2563eb; color: white; border-radius: 4px; font-size: 12px; }
  .section-title .meta { margin-left: auto; font-size: 12px; color: #6b7280; font-weight: 400; }

  /* 학생 정보 */
  .student-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .info-field { display: flex; flex-direction: column; gap: 4px; }
  .info-field label { font-size: 12px; color: #6b7280; font-weight: 600; }
  .info-field select, .info-field input { padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; font-family: inherit; }
  .info-field input:focus, .info-field select:focus { outline: none; border-color: #2563eb; }

  /* 학교지정 - 교과군별 그룹 */
  .req-group { margin-bottom: 10px; }
  .req-group-header { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #1e3a8a; margin-bottom: 6px; padding: 4px 8px; background: #eff6ff; border-radius: 4px; }
  .req-group-count { margin-left: auto; font-size: 11px; color: #6b7280; font-weight: 400; }
  .req-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .req-chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px;
    background: #eff6ff; color: #1e3a8a; border: 1px solid #93c5fd; border-radius: 4px;
    font-size: 12px; font-weight: 500;
  }
  .req-chip .term { font-size: 10px; color: #1e40af; font-weight: 600; opacity: 0.85; }
  .req-chip .badge { font-size: 10px; background: #1e3a8a; color: white; padding: 1px 4px; border-radius: 3px; }

  /* 계열·학과 선택 */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip {
    padding: 5px 10px; background: #f9fafb; color: #374151;
    border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px;
    cursor: pointer; font-family: inherit;
  }
  .chip:hover { background: #e5e7eb; }
  .chip.active { background: #2563eb; color: white; border-color: #2563eb; }
  .level-label { font-size: 11px; color: #6b7280; margin: 4px 0 2px; font-weight: 600; }

  /* 추천 과목 */
  .selected-path { font-size: 12px; color: #1e3a8a; background: #eff6ff; padding: 6px 10px; border-radius: 4px; margin-bottom: 8px; border: 1px solid #bfdbfe; }
  .rec-group { margin-bottom: 8px; padding: 8px 10px; background: #fefce8; border: 1px solid #fde68a; border-radius: 4px; }
  .rec-group-title { font-size: 12px; font-weight: 600; color: #92400e; margin-bottom: 6px; }
  .rec-chip {
    display: inline-block; padding: 4px 8px; margin: 2px;
    background: #ffffff; color: #92400e; border: 1px solid #fbbf24; border-radius: 4px;
    font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .rec-chip:hover { background: #fef3c7; }
  .rec-chip.selected { background: #f59e0b; color: white; border-color: #d97706; }
  .rec-chip.joint { background: #f3f4f6; color: #6b7280; border: 1px dashed #9ca3af; cursor: default; position: relative; }
  .rec-chip.joint .joint-label { font-size: 9px; background: #6b7280; color: white; padding: 1px 4px; border-radius: 2px; margin-left: 4px; font-weight: 600; }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: #4b5563; margin-top: 8px; padding: 6px 8px; background: #f9fafb; border-radius: 4px; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-box { display: inline-block; width: 14px; height: 14px; border-radius: 2px; }

  /* 선택 그리드 */
  .choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 12px; }
  .choice-card { border: 1px solid #d1d5db; border-radius: 6px; padding: 10px; background: #fafafa; }
  .choice-card-title { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: #111827; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #d1d5db; }
  .choice-card-count { font-size: 12px; color: #2563eb; font-weight: 600; }
  .choice-card-count.full { color: #16a34a; }
  .choice-card-count.over { color: #dc2626; }
  .sub-group { margin-bottom: 8px; }
  .sub-group-header { display: flex; align-items: center; font-size: 11px; font-weight: 600; color: #374151; padding: 3px 6px; background: #e5e7eb; border-radius: 3px; margin-bottom: 4px; }
  .sub-group-count { margin-left: auto; font-size: 10px; color: #6b7280; }
  .sub-cell {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 8px; margin-bottom: 3px; background: white;
    border: 1px solid #d1d5db; border-radius: 4px;
    font-size: 12px; cursor: pointer; position: relative;
  }
  .sub-cell:hover { background: #f3f4f6; }
  .sub-cell.selected { background: #fef3c7; border-color: #f59e0b; font-weight: 600; }
  .sub-cell.recommended { border-left: 3px solid #f59e0b; }
  .sub-cell .type { font-size: 10px; color: #6b7280; }
  .sub-cell.selected .type { color: #92400e; }

  /* 학점 점검 카드 */
  .credit-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .credit-card { padding: 10px; background: #f9fafb; border: 1px solid #d1d5db; border-radius: 6px; }
  .credit-label { font-size: 11px; color: #6b7280; font-weight: 600; margin-bottom: 4px; }
  .credit-value { font-size: 22px; font-weight: 700; color: #111827; }
  .credit-target { font-size: 11px; color: #6b7280; }
  .credit-card.ok { background: #dcfce7; border-color: #16a34a; }
  .credit-card.ok .credit-value { color: #15803d; }
  .credit-card.warn { background: #fef3c7; border-color: #f59e0b; }
  .credit-card.warn .credit-value { color: #b45309; }
  .credit-card.err { background: #fee2e2; border-color: #dc2626; }
  .credit-card.err .credit-value { color: #b91c1c; }

  .rule-list { list-style: none; }
  .rule-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 4px;
    margin-bottom: 4px; font-size: 12px;
  }
  .rule-status { display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%; font-weight: 700; color: white; font-size: 11px; }
  .rule-item.ok .rule-status { background: #16a34a; }
  .rule-item.no .rule-status { background: #dc2626; }
  .rule-item.ok { background: #dcfce7; border-color: #86efac; }
  .rule-item.no { background: #fee2e2; border-color: #fca5a5; }

  /* PDF 요약 */
  .summary-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .summary-table th, .summary-table td { border: 1px solid #d1d5db; padding: 6px 8px; text-align: left; }
  .summary-table th { background: #f3f4f6; font-weight: 600; }

  /* 인쇄 스타일 */
  @media print {
    body { background: white; padding: 0; }
    .container { max-width: 100%; }
    .btn-pdf, .legend { display: none !important; }
    .section { border: 1px solid #999; box-shadow: none; page-break-inside: avoid; margin-bottom: 8px; }
    .chip:not(.active) { display: none; }
    .rec-chip:not(.selected):not(.joint) { display: none; }
    .rec-chip.joint { display: inline-block; }
    .sub-cell:not(.selected) { display: none; }
    .sub-group:not(:has(.sub-cell.selected)) { display: none; }
    .credit-card { background: white !important; border: 1px solid #999 !important; }
    .credit-card .credit-value { color: black !important; }
    .rule-item { background: white !important; }
    .req-chip { background: white !important; border: 1px solid #333 !important; color: black !important; }
    .req-chip .badge { background: #333 !important; }
  }

  @page { size: A4; margin: 12mm; }
</style>
</head>
<body>
<div class="container">

<div class="header">
  <div>
    <h1>영파여고 과목선택 도우미</h1>
    <div class="subtitle">2026학년도 입학생 · 2022 개정 교육과정 · v2.4</div>
  </div>
  <button class="btn-pdf" onclick="window.print()">PDF로 저장 / 인쇄</button>
</div>

<!-- 0. 학생정보 -->
<div class="section">

      <input type="text" id="career3" maxlength="20" placeholder="예: 간호사">

  </div>
</div>

<!-- 1. 학교지정 과목 -->
<div class="section">
  <div class="section-title">
    <span class="num">1</span>학교지정 과목 (필수 이수)
    <span class="meta">35과목 / 105학점</span>
  </div>
  <div id="required-groups"></div>
</div>

<!-- 2. 희망 계열·학과 선택 -->
<div class="section">
  <div class="section-title"><span class="num">2</span>희망 계열·학과 선택</div>
  <div class="level-label">분야</div>
  <div class="chips" id="field-chips"></div>
  <div class="level-label">계열</div>
  <div class="chips" id="series-chips"></div>
  <div class="level-label">학과</div>
  <div class="chips" id="major-chips"></div>
</div>

<!-- 3. 전공 추천 과목 -->
<div class="section">
  <div class="section-title">
    <span class="num">3</span>전공 추천 과목
    <span class="meta">안내서 학과별 페이지 기준</span>
  </div>
  <div class="selected-path" id="selected-path">학과를 선택하면 추천 과목이 표시됩니다.</div>
  <div id="rec-area"></div>
  <div class="legend">
    <div class="legend-item"><span class="legend-box" style="background:#ffffff;border:1px solid #fbbf24"></span>학교 개설 과목 (클릭하여 선택)</div>
    <div class="legend-item"><span class="legend-box" style="background:#f59e0b"></span>선택됨</div>
    <div class="legend-item"><span class="legend-box" style="background:#f3f4f6;border:1px dashed #9ca3af"></span>공동교육과정참고</div>
  </div>
</div>

<!-- 4. 선택 과목 그리드 -->
<div class="section">
  <div class="section-title">
    <span class="num">4</span>선택 과목 (영파여고 학점 배당표)
    <span class="meta">교과군별 분류</span>
  </div>
  <div class="choice-grid" id="choice-grid"></div>
</div>

<!-- 5. 이수 학점 점검 -->
<div class="section">
  <div class="section-title"><span class="num">5</span>이수 학점 점검</div>
  <div class="credit-cards" id="credit-cards"></div>
  <ul class="rule-list" id="rule-list"></ul>
</div>

<!-- 6. 선택 결과 요약 -->
<div class="section">
  <div class="section-title"><span class="num">6</span>선택 결과 요약</div>
  <table class="summary-table">
    <tbody id="summary-body"></tbody>
  </table>
</div>

</div>

// 학교지정 과목 그룹 렌더
function renderRequired() {
  const root = document.getElementById('required-groups');
  let html = '';
  for (const [grp, subs] of Object.entries(SCHOOL_REQUIRED)) {
    const total = subs.reduce((s,x) => s + x[2], 0);
    html += `<div class="req-group">
      <div class="req-group-header">${grp}<span class="req-group-count">${subs.length}과목 / ${total}학점</span></div>

    }
    html += `</div></div>`;
  }
  root.innerHTML = html;
}

// 학생 정보 select 채우기
function fillSelects() {
  const cls = document.getElementById('class');
  for (let i=1; i<=11; i++) cls.innerHTML += `<option value="${i}">${i}반</option>`;
  const num = document.getElementById('number');
  for (let i=1; i<=30; i++) num.innerHTML += `<option value="${i}">${i}번</option>`;

// 분야 칩
function renderFields() {
  const root = document.getElementById('field-chips');
  root.innerHTML = '';
  for (const field of Object.keys(MAJORS)) {
    const btn = document.createElement('button');
    btn.className = 'chip' + (state.field === field ? ' active' : '');
    btn.textContent = field;
    btn.onclick = () => { state.field = field; state.series = null; state.major = null; renderAll(); };
    root.appendChild(btn);
  }
}

// 계열 칩
function renderSeries() {
  const root = document.getElementById('series-chips');
  root.innerHTML = '';
  if (!state.field) return;
  for (const series of Object.keys(MAJORS[state.field])) {
    const btn = document.createElement('button');
    btn.className = 'chip' + (state.series === series ? ' active' : '');
    btn.textContent = series;
    btn.onclick = () => { state.series = series; state.major = null; renderAll(); };
    root.appendChild(btn);
  }
}

// 학과 칩
function renderMajors() {
  const root = document.getElementById('major-chips');
  root.innerHTML = '';
  if (!state.field || !state.series) return;
  for (const major of Object.keys(MAJORS[state.field][state.series])) {
    const btn = document.createElement('button');
    btn.className = 'chip' + (state.major === major ? ' active' : '');
    btn.textContent = major;
    btn.onclick = () => { state.major = major; renderAll(); };
    root.appendChild(btn);
  }
}

// 학교 개설 선택 과목 set 구하기
function getSchoolChoiceSet() {
  const s = new Set();
  for (const g of Object.values(CHOICE_GROUPS)) {
    for (const subs of Object.values(g.subjects_by_group)) {
      for (const [name] of subs) s.add(name);
    }
  }
  return s;
}
const SCHOOL_CHOICE_SET = getSchoolChoiceSet();
const SCHOOL_REQUIRED_SET = new Set();
for (const subs of Object.values(SCHOOL_REQUIRED)) {
  for (const [name] of subs) SCHOOL_REQUIRED_SET.add(name);
}
const ALL_SCHOOL = new Set([...SCHOOL_CHOICE_SET, ...SCHOOL_REQUIRED_SET]);

// 공동교육과정 판정: 학교 미개설이면서 (JOINT_CURRICULUM 목록에 있거나 진로/융합 성격의 과목)
function isJointCurriculum(subject) {
  if (ALL_SCHOOL.has(subject)) return false;
  // 명시 목록 또는 일반적인 공동교육과정 패턴
  if (JOINT_CURRICULUM.includes(subject)) return true;
  // 심화/고급/전문 패턴
  if (/심화|고급|전문|이론|음악사|미술사/.test(subject)) return true;
  return false;
}

    html += `<div class="rec-group"><div class="rec-group-title">${type} 선택 과목 추천</div>`;

        html += `<span class="rec-chip joint">${sub}<span class="joint-label">공동교육과정참고</span></span>`;
      }
      // 그 외 미개설 과목은 표시 안 함 (기존 "학교미개설" 제거)
    }
    html += `</div>`;
  }
  area.innerHTML = html;
}

// 과목 토글
function toggleSubject(name) {
  if (state.selected.has(name)) state.selected.delete(name);
  else state.selected.add(name);
  renderChoiceGrid();
  renderRecArea();
  renderCredits();
  renderSummary();
}
window.toggleSubject = toggleSubject;

// 선택 과목 그리드 (교과군별)
function renderChoiceGrid() {
  const root = document.getElementById('choice-grid');
  let html = '';
  const rec = state.major ? MAJORS[state.field][state.series][state.major] : null;
  const recSet = new Set();
  if (rec) {
    for (const subs of Object.values(rec)) for (const s of subs) recSet.add(s);
  }
  for (const [key, info] of Object.entries(CHOICE_GROUPS)) {
    let selCount = 0;
    let groupHtml = '';
    for (const [grpName, subs] of Object.entries(info.subjects_by_group)) {
      let grpSel = 0;
      let cellHtml = '';
      for (const [name, type, credit] of subs) {
        const isSel = state.selected.has(name);
        if (isSel) { selCount++; grpSel++; }
        const isRec = recSet.has(name);
        cellHtml += `<div class="sub-cell${isSel ? ' selected' : ''}${isRec ? ' recommended' : ''}" onclick="toggleSubject('${name}')">
          <span>${name}</span><span class="type">${type}</span>
        </div>`;
      }
      groupHtml += `<div class="sub-group">
        <div class="sub-group-header">${grpName}<span class="sub-group-count">${grpSel}/${subs.length}</span></div>
        ${cellHtml}
      </div>`;
    }
    let cls = '';
    if (selCount === info.max) cls = 'full';
    else if (selCount > info.max) cls = 'over';
    html += `<div class="choice-card">
      <div class="choice-card-title">${info.name}<span class="choice-card-count ${cls}">${selCount} / ${info.max}택</span></div>
      ${groupHtml}
    </div>`;
  }
  root.innerHTML = html;
}

// 학점 계산
function computeCredits() {
  // 학교지정
  let reqCredit = 0, reqCount = 0;
  for (const subs of Object.values(SCHOOL_REQUIRED)) {
    for (const [n, t, c] of subs) { reqCredit += c; reqCount++; }
  }
  // 선택군
  let chCredit = 0, chCount = 0;
  for (const g of Object.values(CHOICE_GROUPS)) {
    for (const subs of Object.values(g.subjects_by_group)) {
      for (const [n, t, c] of subs) {
        if (state.selected.has(n)) { chCredit += c; chCount++; }
      }
    }
  }
  return { reqCount, reqCredit, chCount, chCredit, totalCount: reqCount + chCount, totalCredit: reqCredit + chCredit };
}

function renderCredits() {
  const c = computeCredits();
  const cards = document.getElementById('credit-cards');
  cards.innerHTML = `
    <div class="credit-card"><div class="credit-label">학교지정 과목</div><div class="credit-value">${c.reqCount}과목</div><div class="credit-target">${c.reqCredit}학점</div></div>
    <div class="credit-card ${c.chCount === 23 ? 'ok' : 'warn'}"><div class="credit-label">선택 과목</div><div class="credit-value">${c.chCount}/23과목</div><div class="credit-target">${c.chCredit}/69학점</div></div>
    <div class="credit-card ${c.totalCount === 58 ? 'ok' : ''}"><div class="credit-label">교과 합계</div><div class="credit-value">${c.totalCount}/58과목</div><div class="credit-target">${c.totalCredit}/174학점</div></div>
    <div class="credit-card"><div class="credit-label">총 이수 (창체 18 포함)</div><div class="credit-value">${c.totalCredit + 18}학점</div><div class="credit-target">/ 192학점 목표</div></div>
  `;

  // 규정 검증
  const rules = [];
  // 각 선택군 택수
  for (const [k, info] of Object.entries(CHOICE_GROUPS)) {
    let cnt = 0;
    for (const subs of Object.values(info.subjects_by_group)) for (const [n] of subs) if (state.selected.has(n)) cnt++;
    rules.push({ ok: cnt === info.max, text: `${info.name}: ${cnt}/${info.max}과목 선택` });
  }
  // 기초교과 최대 8과목
  const baseGroups = ['국어','수학','영어'];
  let baseCnt = 0;
  for (const info of Object.values(CHOICE_GROUPS)) {
    for (const [grp, subs] of Object.entries(info.subjects_by_group)) {
      if (baseGroups.includes(grp)) for (const [n] of subs) if (state.selected.has(n)) baseCnt++;
    }
  }
  rules.push({ ok: baseCnt <= 8, text: `기초교과(국·수·영) 선택: ${baseCnt}/8과목 이하` });
  // 기·정/제2/교양 합 4과목 이상
  const specGroups = ['기술·가정/정보','제2외국어/한문','교양'];
  let specCnt = 0;
  for (const info of Object.values(CHOICE_GROUPS)) {
    for (const [grp, subs] of Object.entries(info.subjects_by_group)) {
      if (specGroups.includes(grp)) for (const [n] of subs) if (state.selected.has(n)) specCnt++;
    }
  }
  rules.push({ ok: specCnt >= 4, text: `기술·가정/정보+제2외국어/한문+교양 합계: ${specCnt}/4과목 이상` });

  const list = document.getElementById('rule-list');
  list.innerHTML = rules.map(r => `<li class="rule-item ${r.ok ? 'ok' : 'no'}"><span class="rule-status">${r.ok ? '✓' : '!'}</span>${r.text}</li>`).join('');
}

// 요약 테이블
function renderSummary() {
  const tb = document.getElementById('summary-body');
  const v = id => (document.getElementById(id).value || '-');
  let html = `
    <tr><th>학년/반/번호/이름</th><td>${v('grade')}학년 ${v('class')}반 ${v('number')}번 / ${v('name')}</td></tr>
    <tr><th>진로희망</th><td>1지망: ${v('career1')} / 2지망: ${v('career2')} / 3지망: ${v('career3')}</td></tr>
    <tr><th>희망 학과</th><td>${state.field || '-'} > ${state.series || '-'} > ${state.major || '-'}</td></tr>
  `;
  for (const [k, info] of Object.entries(CHOICE_GROUPS)) {
    const sels = [];
    for (const subs of Object.values(info.subjects_by_group)) for (const [n] of subs) if (state.selected.has(n)) sels.push(n);
    html += `<tr><th>${info.name}</th><td>${sels.length ? sels.join(', ') : '-'}</td></tr>`;
  }
  tb.innerHTML = html;
}

function renderAll() {
  renderFields();
  renderSeries();
  renderMajors();
  renderRecArea();
  renderChoiceGrid();
  renderCredits();
  renderSummary();
}

// 초기화
fillSelects();
renderRequired();
renderAll();

// 학생정보 입력 시 요약 갱신
['grade','class','number','name','career1','career2','career3'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderSummary);
  document.getElementById(id).addEventListener('change', renderSummary);
});

</script>
